name: NetOpsKube tests

on:
  push:
    branches: [main]

env:
  TERM: dumb

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: CSPDevLabs/kpt
          ref: feat/portal-embedding
          path: kpt

      - name: Run unit tests and requirement checks
        env:
          KPT_ROOT: ${{ github.workspace }}/kpt
        run: make test

  kpt-recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: CSPDevLabs/kpt
          ref: feat/portal-embedding
          path: kpt

      - name: Install yq
        run: |
          curl -fsSL -o yq https://github.com/mikefarah/yq/releases/download/v4.42.1/yq_linux_amd64
          echo "1a95960dddd426321354d58d2beac457717f7c49a9ec0806749a5a9e400eb45e  yq" | sha256sum -c -
          sudo install -m 0755 yq /usr/local/bin/yq

      - name: Validate BNG and DIA kpt packages
        working-directory: kpt
        run: |
          if [ -f Makefile ] && grep -q '^test:' Makefile; then
            make test
          else
            chmod +x test/validate-recipes.sh
            YQ="$(command -v yq)" ./test/validate-recipes.sh
          fi

  nok-controller:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: CSPDevLabs/nok-controller
          path: nok-controller

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run controller unit tests
        working-directory: nok-controller
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-flask pytest-mock
          pytest -q
