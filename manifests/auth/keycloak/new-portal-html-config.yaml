apiVersion: v1
kind: ConfigMap
metadata:
  name: nok-apps-portal-nginx-config
  namespace: nok-base
data:
  nok-portal.conf: |
    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;

        location / {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            try_files $uri $uri/ /index.html;
        }

        location = /menu-config.json {
            default_type application/json;
            add_header Cache-Control "no-store";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        location = /healthz {
            add_header Content-Type text/plain;
            return 200 "OK\n";
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico)$ {
            expires 1y;
            log_not_found off;
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nok-apps-portal-html-config
  namespace: nok-base
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8">
    <title>NetOpsKube Portal</title>

    <style>
    :root {
      --primary: #0a192f;
      --secondary: #112240;
      --accent: #1e90ff;
      --light: #4da3ff;
      --glass: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.15);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      overflow: hidden;
    }

    /* ---------- TOP BAR ---------- */
    .topbar {
      height: 50px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      padding: 0 15px;
      border-bottom: 1px solid var(--border);
    }

    .hamburger {
      font-size: 22px;
      cursor: pointer;
      margin-right: 15px;
      user-select: none;
    }

    .portal-title {
      font-size: 1.2em;
      font-weight: 600;
      color: var(--light);
    }

    .version {
      font-size: 14px;
      color: var(--light);
    }

    /* ---------- MAIN LAYOUT ---------- */
    .main-layout {
      flex: 1;
      display: flex;
      height:100%;
      overflow: hidden;
    }


    /* ---------- CONTENT ---------- */

    .content{
        flex:1;
        min-width:0;
        min-height:0;
        display:flex;
        overflow:hidden;
        flex-direction:column;
        display:flex;
        position:relative;
    }
    
    #app-frame {
        width:100%;
        height:100%;
        border:none;
        background:white;
        display:none;
    }

    /* ---------- SIDEBAR ---------- */
    
    .sidebar{
        width:220px;
        background:#081120;
        transition:width .25s;
        overflow:visible;
        border-right:1px solid rgba(255,255,255,.12);
    }

    .sidebar-header{
        height:50px;
        display:flex;
        align-items:center;
        padding:0 18px;
        border-bottom:1px solid rgba(255,255,255,.12);
    }
    
    .sidebar-header .hamburger{
        margin:0;
    }
    
    .sidebar.collapsed{
        width:62px;
    }
    
    .nav-item{
        display:flex;
        align-items:center;
        gap:15px;
        padding:15px;
        cursor:pointer;
        transition:.25s;
    }
    
    .nav-item:hover{
        background:rgba(255,255,255,.08);
    }
    
    .nav-item.active{
        background:#1e90ff;
    }
    
    .nav-icon{
        width:26px;
        height:26px;
        display:flex;
        align-items:center;
        justify-content:center;
        flex-shrink:0;
    }

    .nav-icon img{
        width:20px;
        height:20px;
        object-fit:contain;
    }
    
    .sidebar.collapsed .nav-text{
        display:none;
    }

    /* Sidebar */
    .sidebar-icon{
        width:20px;
        height:20px;
        object-fit:contain;
    }

    /* Tooltip for collapsed sidebar */
    .sidebar.collapsed .nav-item {
        position: relative;
    }
    
    .sidebar.collapsed .nav-item::after {
        content: attr(data-tooltip);
        position: absolute;
        left: 65px;
        top: 50%;
        transform: translateY(-50%);
    
        background: rgba(10,25,47,0.98);
        color: white;
        padding: 6px 12px;
        border-radius: 6px;
    
        white-space: nowrap;
        font-size: 14px;
    
        opacity: 0;
        visibility: hidden;
        transition: opacity .2s ease;
    
        pointer-events: none;
        z-index: 9999;
    }
    
    .sidebar.collapsed .nav-item:hover::after {
        opacity: 1;
        visibility: visible;
    }

    .topbar.hidden {
        display: none;
    }

    /* ---------- ACCOUNT PANEL ---------- */
    .account-panel {
      position: fixed;
      top: 50px;
      right: -240px;
      width: 220px;
      height: calc(100% - 50px);
      background: rgba(10,25,47,0.98);
      border-left: 1px solid var(--border);
      transition: right 0.3s ease;
      z-index: 3000;
      padding: 20px;
      font-size: 14px;
    }

    .account-panel.active {
      right: 0;
    }

    .account-circle {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .account-circle:hover {
      transform: scale(1.05);
      box-shadow: 0 0 8px var(--accent);
    }

    .logout-btn {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: calc(100% - 40px);
      padding: 10px;
      background: #e74c3c;
      border: none;
      color: white;
      font-size: 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    
    .logout-btn:hover {
      background: #c0392b;
    }

    .user-avatar{
        display:flex;
        justify-content:center;
        align-items:center;
        margin-bottom:25px;
    
        width:180px;
        height:150px;
    
        margin-left:auto;
        margin-right:auto;
    
        border:2px solid rgba(255,255,255,0.2);
        border-radius:14px;
    }
    
    .user-avatar img{
        width:50px;
        height:50px;
        object-fit:contain;
    }

    #welcome-screen{
        width:100%;
        height:100%;
        display:flex;
        justify-content:center;
        align-items:flex-start;
    
        background:
            radial-gradient(circle at top left,#154c79 0%,transparent 40%),
            radial-gradient(circle at bottom right,#0f6ab5 0%,transparent 35%),
            linear-gradient(135deg,#081120,#0a192f,#112240);
    
        overflow:auto;
    }
    
    .home-dashboard{
        width:100%;
        max-width:1200px;
        display:flex;
        flex-direction:column;
        align-items:center;
        margin-top:40px;
        padding:0 40px 40px;
    }
    
    .dashboard-title{
        margin:0;
        font-size:54px;
        font-weight:700;
        color:white;
        letter-spacing:2px;
    }
    
    .dashboard-subtitle{
        margin-top:10px;
        margin-bottom:55px;
        color:#9fc6ff;
        font-size:20px;
    }
    
    .global-services{
        width:100%;
        display:flex;
        justify-content:center;
        gap:35px;
        flex-wrap:wrap;
    }
    
    .service-card{
        width:300px;
        height:170px;
        background:rgba(255,255,255,.08);
        border:1px solid rgba(255,255,255,.12);
        border-radius:20px;
        backdrop-filter:blur(18px);
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:center;
        cursor:pointer;
        transition:.35s;
    }
    
    .service-card:hover{
        transform:translateY(-10px);
        border-color:#1e90ff;
        box-shadow:
            0 18px 40px rgba(30,144,255,.35);
    }
    
    .service-icon{
        width:60px;
        height:60px;
        margin-bottom:18px;
        display:flex;
        justify-content:center;
        align-items:center;
    }
    
    .service-icon img{
        width:100%;
        height:100%;
        object-fit:contain;
    }
    
    .service-title{
        font-size:26px;
        font-weight:600;
    }
    
    .service-desc{
        margin-top:10px;
        color:#b8d7ff;
        font-size:15px;
        text-align:center;
        padding:0 25px;
        line-height:1.5;
    }
    /* ---------- Loading Overlay ---------- */


    .loading-overlay{
        position:absolute;
        inset:0;
        display:flex;
        justify-content:center;
        align-items:center;
        flex-direction:column;
        background:linear-gradient(135deg,#081120,#112240);
        z-index:10;
    }

    .app-container{
        position: relative;
        flex: 1;
        width: 100%;
        height: 100%;
        overflow: hidden;
    }
    
    .loader{
        width:60px;
        height:60px;
    
        border:6px solid rgba(255,255,255,.25);
        border-top:6px solid #1e90ff;
        border-radius:50%;
    
        animation:spin 1s linear infinite;
    }
    
    .loading-text{
        margin-top:20px;
        color:white;
        font-size:18px;
        letter-spacing:1px;
    }
    
    @keyframes spin{
        from{
            transform:rotate(0deg);
        }
        to{
            transform:rotate(360deg);
        }
    }

    .solution-panel{
        margin-top:55px;
        width:900px;
        max-width:95%;
        display:flex;
        flex-direction:column;
        align-items:center;
    }

    .solution-title{
        margin-bottom:20px;
        color:white;
        font-size:26px;
        font-weight:600;
    }
    
    .solution-dropdown{
        width:420px;
        padding:14px 20px;
        font-size:16px;
        color:white;
        background:rgba(255,255,255,.08);
        border:1px solid rgba(255,255,255,.2);
        border-radius:14px;
        backdrop-filter:blur(20px);
        outline:none;
        cursor:pointer;
    }
    
    .solution-dropdown option{
        background:#112240;
        color:white;
    }
    
    .solution-apps{
        margin-top:45px;
        width:100%;
        display:flex;
        justify-content:center;
        gap:30px;
        flex-wrap:wrap;
    }
    
    .app-card{
        width:220px;
        height:150px;
        background:rgba(255,255,255,.08);
        border-radius:18px;
        border:1px solid rgba(255,255,255,.12);
        backdrop-filter:blur(20px);
        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:center;
        cursor:pointer;
        transform:translateY(40px);
        opacity:0;
        transition:.45s;
        box-shadow:0 10px 35px rgba(0,0,0,.25);
    }
    
    .app-card.show{
        transform:translateY(0);
        opacity:1;
    }
    
    .app-card:hover{
        transform:translateY(-8px);
        border-color:#1e90ff;
        box-shadow:0 18px 45px rgba(30,144,255,.35);
    }
    
    .app-icon{
        width:60px;
        height:60px;
        display:flex;
        justify-content:center;
        align-items:center;
        margin-bottom:15px;
    }
    
    .app-icon-img{
        width:52px;
        height:52px;
        object-fit:contain;
    }
    
    .app-name{
        font-size:20px;
        font-weight:600;
    }
    
    </style>
    </head>

    <body>

    <div class="main-layout">

      <div id="sidebar" class="sidebar expanded">
          <div class="sidebar-header">
            <div id="menu-toggle" class="hamburger">☰</div>
          </div>
          <div id="home-nav" class="nav-item active" data-page="home" data-tooltip="Home">
              <span class="nav-icon">🏠</span>
              <span class="nav-text">
                  Home
              </span>
          </div>
          <div id="dynamic-nav"></div>
      </div>

      <div class="content">
        
        <div id="topbar" class="topbar">
            <div class="portal-title">NetOpsKube Portal</div>
            <div id="topbar-right" style="margin-left:auto; display:flex; align-items:center; gap:15px;">
              <span class="version">v1.0</span>
              <div id="account-btn" class="account-circle">
                <svg viewBox="0 0 24 24" fill="white" width="18" height="18">
                  <path d="M12 12c2.7 0 4.8-2.2 4.8-4.8S14.7 2.4 12 2.4 7.2 4.6 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8V22h19.2v-2.8c0-3.2-6.4-4.8-9.6-4.8z"/>
                </svg>
              </div>
            </div>
        </div>

        <div class="app-container">

          <div id="welcome-screen">
            <div class="home-dashboard">
                <div class="global-services">
                    <div class="service-card" data-name="Gitea">
                        <div class="service-icon">
                          <img src="data:image/png;base64," alt="Gitea">
                        </div>
                        <div class="service-title">Gitea</div>
                        <div class="service-desc">
                            Source Code Repository
                        </div>
                    </div>
        
                    <div class="service-card" data-name="BBM (Self Monitoring)">
                        <div class="service-icon">
                          <img src="data:image/png;base64," alt="BBM (Self Monitoring)">
                        </div>
                        <div class="service-title">BBM</div>
                        <div class="service-desc">
                            Self Monitoring Dashboard
                        </div>
                    </div>
        
                    <div class="service-card" data-name="Keycloak">
                        <div class="service-icon">
                          <img src="data:image/svg+xml;base64," alt="Keycloak">
                        </div>
                        <div class="service-title">Keycloak</div>
                        <div class="service-desc">
                            Identity & Access Management
                        </div>
                    </div>
                </div>
        
                <div class="solution-panel">
                    <h2 class="solution-title">
                        Select Solution
                    </h2>
                    <select id="solution-select" class="solution-dropdown">
                        <option value="">Choose Solution...</option>
                    </select>
                    <div id="solution-apps" class="solution-apps"></div>
                
                </div>
                </div>
        
            </div>
          
          </div>
      
          <div id="loading-overlay" class="loading-overlay" style="display:none;">
              <div class="loader"></div>
              <div class="loading-text">Loading...</div>
          </div>
          <iframe id="app-frame" style="display:none;"></iframe>
        
        </div>
        
      </div>
    </div>

    <div id="account-panel" class="account-panel">
      <div class="user-avatar">
        <img src="data:image/png;base64," />
      </div>
      <button id="logout-btn" class="logout-btn">
        Logout
      </button>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {

      const appFrame = document.getElementById('app-frame');
      const loadingOverlay = document.getElementById("loading-overlay");
      appFrame.onload = () => {
          loadingOverlay.style.display = "none";
      };
      
      const logoutBtn = document.getElementById('logout-btn');
      if (logoutBtn) {
        logoutBtn.addEventListener('click', () => {
          appFrame.src = "about:blank";
          window.top.location.href = "/oauth2/sign_out?rd=/oauth2/start?rd=%2F"
      
        });
      }

      const accountBtn = document.getElementById('account-btn');
      const accountPanel = document.getElementById('account-panel');

      const sidebar=document.getElementById("sidebar");
      const menuToggle=document.getElementById("menu-toggle");
      menuToggle.onclick=()=>{
        sidebar.classList.toggle("collapsed");
      };

      if (accountBtn) {
        accountBtn.addEventListener('click', () => {
          accountPanel.classList.toggle('active');
        });
      }

      document.addEventListener('click', (e) => {
        const isAccountClick = accountPanel.contains(e.target) || accountBtn.contains(e.target);

        if (!isAccountClick) {
          accountPanel.classList.remove('active');
        }
      });

      fetch('/menu-config.json')
        .then(resp => resp.ok ? resp.json() : Promise.reject(resp.status))
        .then(menuItems => {
          
          const globalApps = {};
          const dynamicNav=document.getElementById("dynamic-nav");
          const welcomeScreen = document.getElementById("welcome-screen");

          const solutionSelect=document.getElementById("solution-select");
          const solutionApps=document.getElementById("solution-apps");

          const solutions = {};
          menuItems.solutions.forEach(solution => {
              solutions[solution.id] = solution;
              const option = document.createElement("option");
              option.value = solution.id;
              option.textContent = solution.displayName;
              solutionSelect.appendChild(option);
          });

          const appIcons = {
            Prometheus: '<img src="data:image/svg+xml;base64," class="sidebar-icon">',
            Grafana: '<img src="data:image/svg+xml;base64," class="sidebar-icon">',
            Alertmanager: '<img src="data:image/svg+xml;base64," class="sidebar-icon">',
            Gitea: '<img src="data:image/png;base64," class="sidebar-icon">',
            "BBM (Self Monitoring)": '<img src="data:image/png;base64," class="sidebar-icon">',
            Keycloak: '<img src="data:image/svg+xml;base64," class="sidebar-icon">'
          };

          function buildSidebar(solution){
              dynamicNav.innerHTML="";
              const allApps=[];
              menuItems.featured.forEach(app=>{
                  allApps.push(app);
              });
              if(solution){
                  solution.services.forEach(app=>{
                      allApps.push(app);
                  });
              }
              allApps.forEach(app=>{
                  const item=document.createElement("div");
                  item.className="nav-item";
                  item.setAttribute("data-tooltip", app.name);
                  item.innerHTML=`
                      <span class="nav-icon">
                          ${appIcons[app.name] || "⚙️"}
                      </span>
                      <span class="nav-text">
                          ${app.name}
                      </span>
                  `;
                  item.onclick=()=>{
                      document.querySelectorAll(".nav-item")
                          .forEach(n=>n.classList.remove("active"));
                      item.classList.add("active");
                      if(app.openInNewTab){
                          window.open(app.path,"_blank");
                          return;
                      }
                      document.getElementById("topbar").classList.add("hidden");
                      welcomeScreen.style.display="none";
                      loadingOverlay.style.display = "flex";
                      appFrame.style.display="block";
                      appFrame.src=app.path;
                  };
                  dynamicNav.appendChild(item);
              });
          }          
          
          
          document.getElementById("home-nav").onclick = () => {
              document.getElementById("topbar").classList.remove("hidden");
              dynamicNav.innerHTML = "";
              solutionSelect.value = "";
              solutionApps.innerHTML = "";
              document.querySelectorAll(".nav-item")
                  .forEach(n => n.classList.remove("active"));
              document.getElementById("home-nav")
                  .classList.add("active");
              appFrame.src = "about:blank";
              appFrame.style.display = "none";
              welcomeScreen.style.display = "flex";
          };
          
          solutionSelect.onchange=()=>{
              solutionApps.innerHTML="";
              const solution=solutions[solutionSelect.value];
              if(!solutionSelect.value){
                solutionApps.innerHTML="";
                return;
              }

              solution.services.forEach((app,index)=>{
                  const card=document.createElement("div");
                  card.className="app-card";
                  card.innerHTML = `
                      <div class="app-icon">
                          ${(appIcons[app.name] || "⚙️").replace("sidebar-icon", "app-icon-img")}
                      </div>
                      <div class="app-name">${app.name}</div>
                  `;
                  card.onclick=()=>{
                      if(app.openInNewTab){
                          window.open(app.path,"_blank");
                      }else{
                          buildSidebar(solutionSelect.value ? solutions[solutionSelect.value] : null);
                          document.getElementById("topbar").classList.add("hidden");
                          welcomeScreen.style.display="none";
                          loadingOverlay.style.display = "flex";
                          appFrame.style.display="block";
                          appFrame.src=app.path;
                      }
                  };
                  solutionApps.appendChild(card);
                  setTimeout(()=>{
                      card.classList.add("show");
                  },120*index);
              });  
          };
          
          menuItems.featured.forEach(item => {
              globalApps[item.name]=item;
          });

          document.querySelectorAll(".service-card").forEach(card=>{
              card.onclick=()=>{
                  const app=globalApps[card.dataset.name];
                  if(!app) return;
                  if(app.openInNewTab){
                      window.open(app.path,"_blank");
                  }else{
                      buildSidebar(null);
                      document.getElementById("topbar").classList.add("hidden");
                      document.getElementById("welcome-screen").style.display="none";
                      loadingOverlay.style.display = "flex";
                      appFrame.style.display="block";
                      appFrame.src=app.path;
                  }
              };
          });


        })
        .catch(err => {
          alert("Failed to load menu configuration");
        });

    });
    </script>

    </body>
    </html>
