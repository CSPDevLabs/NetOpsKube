apiVersion: v1
kind: ConfigMap
metadata:
  name: nok-haproxy-cfg
  namespace: nok-base
data:
  haproxy.cfg: |
    global
      log stdout format raw local0

    defaults
      log global
      mode http
      option httplog
      option dontlognull
      option forwardfor
      timeout connect 5s
      timeout client  30s
      timeout server  30s

    frontend nok-frontend
      bind :8080
      acl is_login path -i /login
      acl is_auth_root path_reg -i ^/auth/?$
      acl is_auth path_beg /auth
      # Portal static only — everything else goes to ingress-nginx (Gitea, BBM, Grafana, …)
      acl is_portal path -i /
      acl is_portal path -i /index.html /menu-config.json /healthz /favicon.ico
      acl is_portal path_beg /styles.css /icons.js
      http-request redirect code 302 location http://bng.nok.local:8080/auth/realms/netopskube/protocol/openid-connect/auth?client_id=nok-portal&redirect_uri=http%%3A%%2F%%2Fbng.nok.local%%3A8080%%2F&response_type=code&scope=openid if is_login
      http-request redirect code 302 location http://bng.nok.local:8080/auth/realms/netopskube/protocol/openid-connect/auth?client_id=nok-portal&redirect_uri=http%%3A%%2F%%2Fbng.nok.local%%3A8080%%2F&response_type=code&scope=openid if is_auth_root
      use_backend nok-keycloak-backend if is_auth
      use_backend nok-portal-backend if is_portal
      default_backend nok-ingress-backend

    backend nok-keycloak-backend
      option httpchk
      http-check send meth GET uri /auth/realms/netopskube/protocol/openid-connect/certs ver HTTP/1.1 hdr Host bng.nok.local:8080
      http-check expect status 200
      http-request set-header X-Forwarded-Proto http
      http-request set-header X-Forwarded-Port 8080
      http-request set-header X-Forwarded-Host %[req.hdr(Host)]
      http-request set-header X-Real-IP %[src]
      server kc keycloak.nok-base.svc.cluster.local:8080/auth check fall 5 rise 10

    backend nok-portal-backend
      http-request set-header X-Forwarded-Proto http
      http-request set-header X-Forwarded-Port 8080
      http-request set-header X-Forwarded-Host %[req.hdr(Host)]
      http-request set-header X-Real-IP %[src]
      server portal nok-apps-portal-service.nok-base.svc.cluster.local:80 check

    backend nok-ingress-backend
      http-request set-header X-Forwarded-Proto http
      http-request set-header X-Forwarded-Port 8080
      http-request set-header X-Forwarded-Host %[req.hdr(Host)]
      http-request set-header X-Real-IP %[src]
      server ingress ingress-nginx-controller.nok-base.svc.cluster.local:80 check
